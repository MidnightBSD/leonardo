name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up conformance test directories
        run: |
          mkdir -p /tmp/leonardo-conformance/tmp \
                   /tmp/leonardo-conformance/config \
                   /tmp/leonardo-conformance/logs \
                   /tmp/leonardo-conformance/buckets
          printf 'keys:\n  - access_key: AKIACONFORMANCE00001\n    secret_key: ConformanceTestSecretKey123456789012345\n    identity: conformance-test-user\n    enabled: true\n' \
            > /tmp/leonardo-conformance/config/api-keys.yaml
          chmod 0600 /tmp/leonardo-conformance/config/api-keys.yaml

      - name: Build & test
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  freebsd:
    name: build (FreeBSD 14.4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # No Gradle cache restore here — pre-populated Linux cache causes rsync
      # failures when cross-platform-actions syncs the workspace to the BSD VM.

      - name: Build & test on FreeBSD
        uses: cross-platform-actions/action@v1.1.0
        with:
          operating_system: freebsd
          version: '14.4'
          shell: sh
          run: |
            sudo /usr/sbin/pkg update -f
            sudo /usr/sbin/pkg install -y openjdk21
            export JAVA_HOME=/usr/local/openjdk21
            export PATH="$JAVA_HOME/bin:$PATH"
            mkdir -p /tmp/leonardo-conformance/tmp \
                     /tmp/leonardo-conformance/config \
                     /tmp/leonardo-conformance/logs \
                     /tmp/leonardo-conformance/buckets
            printf 'keys:\n  - access_key: AKIACONFORMANCE00001\n    secret_key: ConformanceTestSecretKey123456789012345\n    identity: conformance-test-user\n    enabled: true\n' \
              > /tmp/leonardo-conformance/config/api-keys.yaml
            chmod 0600 /tmp/leonardo-conformance/config/api-keys.yaml
            ./gradlew --no-daemon -g .gradle build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-freebsd
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore

  midnightbsd:
    name: build (MidnightBSD 4.0.4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # No Gradle cache restore here — pre-populated Linux cache causes rsync
      # failures when cross-platform-actions syncs the workspace to the BSD VM.

      - name: Build & test on MidnightBSD
        uses: cross-platform-actions/action@v1.1.0
        with:
          operating_system: midnightbsd
          version: '4.0.4'
          shell: sh
          run: |
            sudo /usr/sbin/mport config set mirror_region us
            sudo /usr/sbin/mport install openjdk21-bin ||  true
            export JAVA_HOME=/usr/local/openjdk21
            export PATH="$JAVA_HOME/bin:$PATH"
            ./gradlew --no-daemon -g .gradle build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-midnightbsd
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore
