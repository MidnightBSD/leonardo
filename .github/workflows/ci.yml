name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build & test
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  freebsd:
    name: build (FreeBSD 14.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: .gradle
          key: freebsd-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: freebsd-gradle-

      - name: Build & test
        uses: cross-platform-actions/action@v1.1.0
        with:
          operating_system: freebsd
          version: '14.2'
          run: |
            sudo mount -t procfs proc /proc
            sudo pkg install -y openjdk21 bash
            export JAVA_HOME=/usr/local/openjdk21
            export PATH=$JAVA_HOME/bin:$PATH
            ./gradlew --no-daemon -g .gradle build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-freebsd
          path: '**/build/reports/tests/**'
          retention-days: 7

  midnightbsd:
    name: build (MidnightBSD 4.0.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: .gradle
          key: midnightbsd-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: midnightbsd-gradle-

      - name: Build & test
        uses: cross-platform-actions/action@v1.1.0
        with:
          operating_system: midnightbsd
          version: '4.0.4'
          run: |
            sudo mount -t fdescfs fdesc /dev/fd
            sudo mount -t procfs proc /proc
            sudo mport config set mirror_region uk
            sudo mport install openjdk21-bin bash
            export JAVA_HOME=/usr/local/openjdk21
            export PATH=$JAVA_HOME/bin:$PATH
            /usr/local/bin/bash ./gradlew --no-daemon -g .gradle build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-midnightbsd
          path: '**/build/reports/tests/**'
          retention-days: 7
